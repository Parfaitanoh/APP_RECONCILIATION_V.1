[server]
# Limite d'upload : 10 Go (valeur en Mo)
maxUploadSize = 10240
# Taille max des messages (Mo)
maxMessageSize = 10240
enableXsrfProtection = true
enableCORS = false

[browser]
gatherUsageStats = false

[theme]
primaryColor = "#023e8a"
backgroundColor = "#f4f6f8"
secondaryBackgroundColor = "#e8eef5"
textColor = "#262730"
font = "sans serif"

[runner]
fastReruns = true
